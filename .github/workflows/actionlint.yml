name: Actionlint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    # Owner checks wait for an explicitly provisioned, repository-isolated Linux pool.
    if: >-
      !(github.repository == 'krotname/NppMarkdownTableEditor' &&
        github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
        (github.event_name != 'pull_request' ||
          (github.event.pull_request.user.login == github.repository_owner &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           !github.event.pull_request.head.repo.fork))) || vars.CI_LINUX_RUNS_ON != ''
    runs-on: >-
      ${{ fromJSON(github.repository == 'krotname/NppMarkdownTableEditor' &&
          github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
          (github.event_name != 'pull_request' ||
            (github.event.pull_request.user.login == github.repository_owner &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             !github.event.pull_request.head.repo.fork)) &&
          vars.CI_LINUX_RUNS_ON || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
